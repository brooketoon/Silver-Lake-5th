<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trouble at Silver Lake: An Aquatic Investigation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --lake-navy:#123B4A;
  --water-teal:#168C8C;
  --marsh-green:#6F9148;
  --field-gold:#E3A83B;
  --rust-coral:#C85D4B;
  --mist-blue:#EAF5F4;
  --warm-sand:#F7F1E3;
  --charcoal:#243238;
  --white:#FFFFFF;
  --font-title:"Fredoka","Baloo 2",system-ui,Arial,sans-serif;
  --font-interface:"Nunito",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --shadow-sm:0 1px 3px rgba(18,59,74,.14);
  --shadow-md:0 4px 14px rgba(18,59,74,.16);
  --shadow-lg:0 10px 30px rgba(18,59,74,.22);
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  color:var(--charcoal);
  background:var(--mist-blue);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-interface);color:var(--lake-navy);line-height:1.2;}
button{font-family:var(--font-interface);cursor:pointer;}
:focus-visible{outline:3px solid var(--field-gold);outline-offset:2px;border-radius:4px;}

/* ---------- App header ---------- */
.app-header{
  position:sticky;top:0;z-index:40;
  background:var(--lake-navy);
  color:var(--white);
  border-bottom:3px solid var(--water-teal);
  box-shadow:var(--shadow-md);
}
.app-header-inner{
  max-width:1100px;margin:0 auto;padding:8px 16px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.brand{display:flex;flex-direction:column;line-height:1.1;}
.brand .sis{font-family:var(--font-title);font-size:1.05rem;letter-spacing:.3px;}
.brand .grade{font-family:var(--font-interface);font-size:.72rem;opacity:.85;text-transform:uppercase;letter-spacing:1px;}
.header-title{flex:1 1 180px;min-width:120px;font-family:var(--font-interface);font-weight:700;font-size:.95rem;color:var(--mist-blue);}
.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.hbtn{
  background:rgba(255,255,255,.12);color:var(--white);border:1px solid rgba(255,255,255,.25);
  border-radius:20px;padding:8px 14px;font-size:.82rem;font-weight:600;min-height:40px;
}
.hbtn:hover{background:rgba(255,255,255,.24);}
.autosave-chip{
  display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-family:var(--font-interface);
  color:var(--mist-blue);background:rgba(0,0,0,.18);padding:6px 10px;border-radius:16px;min-height:32px;
}
.autosave-dot{width:9px;height:9px;border-radius:50%;background:var(--field-gold);transition:background .3s;}
.autosave-chip.saved .autosave-dot{background:var(--marsh-green);}

/* ---------- Layout ---------- */
.stage{max-width:1000px;margin:0 auto;padding:20px 16px 120px;}
.screen{animation:fade .35s ease;}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.card{
  background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow-md);
  padding:22px;margin-bottom:18px;border:1px solid rgba(18,59,74,.06);
}
.eyebrow{font-family:var(--font-interface);text-transform:uppercase;letter-spacing:1.5px;font-size:.72rem;
  font-weight:800;color:var(--water-teal);margin:0 0 6px;}
.screen h1.title{font-family:var(--font-title);font-size:2rem;margin:0 0 6px;color:var(--lake-navy);}
.screen h2{font-size:1.4rem;margin:0 0 10px;}
.lead{font-size:1.05rem;color:var(--charcoal);}
.muted{color:#4c5c63;}
.small{font-size:.85rem;}

/* contour motif */
.contour-band{
  background:
    radial-gradient(120% 60% at 10% 0%,rgba(22,140,140,.10),transparent 60%),
    repeating-radial-gradient(circle at 15% 120%,transparent 0 26px,rgba(18,59,74,.05) 26px 27px);
}

/* ---------- Buttons / nav ---------- */
.btn{
  border:none;border-radius:24px;padding:13px 22px;font-weight:700;font-size:.95rem;
  min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn-gold{background:var(--field-gold);color:var(--charcoal);box-shadow:var(--shadow-sm);}
.btn-gold:hover{filter:brightness(1.05);}
.btn-teal{background:var(--water-teal);color:var(--white);}
.btn-teal:hover{filter:brightness(1.07);}
.btn-navy{background:var(--lake-navy);color:var(--white);}
.btn-outline{background:transparent;border:2px solid var(--water-teal);color:var(--water-teal);}
.btn-ghost{background:var(--mist-blue);color:var(--lake-navy);border:1px solid rgba(18,59,74,.15);}
.btn:disabled{opacity:.42;cursor:not-allowed;filter:none;}
.navbar{
  position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--white);
  border-top:1px solid rgba(18,59,74,.12);box-shadow:0 -4px 16px rgba(18,59,74,.10);
}
.navbar-inner{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center;}
.nav-hint{font-size:.75rem;color:#5a6a70;font-family:var(--font-interface);text-align:center;flex:1;min-width:0;}

/* ---------- Forms ---------- */
label.field-label{display:block;font-family:var(--font-interface);font-weight:700;color:var(--lake-navy);margin:14px 0 6px;font-size:.95rem;}
textarea,input[type=text]{
  width:100%;font-family:var(--font-body);font-size:1rem;color:var(--charcoal);
  border:2px solid rgba(18,59,74,.18);border-radius:10px;padding:11px 12px;background:var(--white);resize:vertical;
}
textarea{min-height:92px;}
textarea:focus,input[type=text]:focus{border-color:var(--water-teal);}
.prompt-box{
  background:var(--warm-sand);border-left:5px solid var(--field-gold);border-radius:8px;
  padding:12px 14px;margin:8px 0;font-family:var(--font-body);
}
.prompt-box .q{font-family:var(--font-interface);font-weight:700;color:var(--lake-navy);}

/* journal / science panels */
.panel-journal{background:var(--warm-sand);border:1px solid #e6dcc2;}
.panel-science{background:var(--mist-blue);border:1px solid #cfe6e4;}

/* ---------- Dialogue / mentor ---------- */
.mentor{display:flex;gap:14px;align-items:flex-start;background:var(--mist-blue);border-radius:var(--radius);padding:16px;border:1px solid #cfe6e4;}
.mentor .avatar{width:64px;height:64px;border-radius:50%;flex:0 0 auto;overflow:hidden;background:var(--water-teal);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-family:var(--font-interface);}
.mentor .avatar img{width:100%;height:100%;object-fit:cover;}
.mentor .who{font-family:var(--font-interface);font-weight:800;color:var(--lake-navy);}
.mentor .role{font-size:.8rem;color:var(--water-teal);font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.speech{margin-top:6px;font-style:normal;}

/* career spotlight */
.spotlight{border:2px dashed var(--marsh-green);border-radius:12px;padding:14px;background:#f3f7ec;}
.spotlight h4{color:var(--marsh-green);margin:0 0 4px;}

/* ---------- Path cards ---------- */
.path-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.path-card{
  border:2px solid rgba(18,59,74,.14);border-radius:var(--radius);padding:18px;background:var(--white);
  display:flex;flex-direction:column;gap:8px;transition:transform .15s,box-shadow .15s,border-color .15s;
  text-align:left;
}
.path-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--water-teal);}
.path-card .tag{font-family:var(--font-interface);font-weight:800;text-transform:uppercase;font-size:.7rem;letter-spacing:1px;color:var(--field-gold);}
.path-card h3{margin:0;font-size:1.15rem;}
.path-card ul{margin:6px 0 0;padding-left:18px;color:#40525a;font-size:.92rem;}
.path-card .choose{margin-top:auto;}

/* image with placeholder */
.img-frame{border-radius:12px;overflow:hidden;border:1px solid rgba(18,59,74,.12);background:var(--warm-sand);}
.img-ph{
  display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;text-align:center;
  min-height:150px;padding:16px;color:#7a6f57;background:
    repeating-linear-gradient(45deg,#f4edda,#f4edda 12px,#efe6cd 12px,#efe6cd 24px);
  font-family:var(--font-interface);
}
.img-ph .fn{font-size:.72rem;color:#9b8f73;word-break:break-all;}
.img-ph .ic{font-size:1.6rem;}
img.lesson-img{display:block;width:100%;height:auto;}

/* ---------- Tabs ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.tab-btn{
  border:2px solid rgba(18,59,74,.18);background:var(--white);color:var(--lake-navy);
  border-radius:10px 10px 0 0;padding:10px 14px;font-weight:700;font-size:.85rem;min-height:44px;position:relative;
}
.tab-btn[aria-selected=true]{background:var(--water-teal);color:#fff;border-color:var(--water-teal);}
.tab-btn .seen{position:absolute;top:4px;right:6px;font-size:.7rem;color:var(--marsh-green);}
.tab-btn[aria-selected=true] .seen{color:#dff3b8;}
.tab-panel{border:2px solid rgba(18,59,74,.14);border-radius:0 12px 12px 12px;padding:16px;background:var(--white);}

/* evidence stars/checks */
.evi-list{display:grid;gap:10px;}
.evi-item{display:flex;gap:10px;align-items:flex-start;border:1px solid rgba(18,59,74,.14);border-radius:10px;padding:10px 12px;background:var(--white);}
.evi-item.sel{border-color:var(--field-gold);background:#fff9ec;box-shadow:inset 0 0 0 1px var(--field-gold);}
.evi-toggle{min-width:44px;min-height:44px;border-radius:10px;border:2px solid var(--field-gold);background:#fff;font-size:1.1rem;color:var(--field-gold);}
.evi-item.sel .evi-toggle{background:var(--field-gold);color:#fff;}
.evi-body{flex:1;}

/* ---------- Graph ---------- */
.graph-controls{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:12px;}
.control-group{border:1px solid rgba(18,59,74,.14);border-radius:10px;padding:10px 12px;background:var(--mist-blue);}
.control-group legend{font-family:var(--font-interface);font-weight:800;font-size:.78rem;color:var(--lake-navy);padding:0 4px;text-transform:uppercase;letter-spacing:.5px;}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;}
.chip{border:2px solid rgba(18,59,74,.2);background:#fff;border-radius:18px;padding:8px 13px;font-weight:700;font-size:.82rem;color:var(--lake-navy);min-height:40px;}
.chip[aria-pressed=true],.chip.active{background:var(--water-teal);color:#fff;border-color:var(--water-teal);}
.chip.locked{background:var(--lake-navy);color:#fff;border-color:var(--lake-navy);opacity:1;cursor:default;}
.graph-wrap{background:var(--white);border:1px solid rgba(18,59,74,.14);border-radius:12px;padding:8px;overflow-x:auto;}
svg .grid-line{stroke:rgba(18,59,74,.10);stroke-width:1;}
svg .axis-line{stroke:var(--charcoal);stroke-width:1.5;}
svg text{font-family:var(--font-body);fill:var(--charcoal);}
.data-table-toggle{margin-top:8px;}
table.data-table{border-collapse:collapse;width:100%;font-size:.85rem;margin-top:8px;}
table.data-table th,table.data-table td{border:1px solid rgba(18,59,74,.18);padding:6px 8px;text-align:center;}
table.data-table th{background:var(--mist-blue);font-family:var(--font-interface);}
.sr-summary{background:#f3f7ec;border-left:4px solid var(--marsh-green);padding:8px 12px;border-radius:6px;font-size:.9rem;margin-top:8px;}

/* reveal blocks */
.reveal{border-top:2px dashed rgba(18,59,74,.18);margin-top:16px;padding-top:14px;}
.hidden{display:none !important;}

/* timeline */
.period-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.oxy-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.8rem;margin:8px 0;}
.oxy-legend span{display:inline-flex;align-items:center;gap:5px;}
.swatch{width:14px;height:14px;border-radius:3px;display:inline-block;}
.algae-toggle{display:inline-flex;align-items:center;gap:8px;margin:8px 0;font-family:var(--font-interface);font-weight:700;}

/* map */
.map-wrap{position:relative;border:1px solid rgba(18,59,74,.16);border-radius:12px;overflow:hidden;background:#dceef0;}
.route-list{display:grid;gap:10px;margin-top:12px;}
.route-btn{
  display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;
  border:2px solid rgba(18,59,74,.16);background:#fff;border-radius:12px;padding:12px 14px;min-height:56px;
}
.route-btn:hover{border-color:var(--water-teal);}
.route-btn.viewed{border-color:var(--marsh-green);background:#f4f8ee;}
.route-btn .rname{font-family:var(--font-interface);font-weight:800;color:var(--lake-navy);}
.route-btn .rmeta{font-size:.78rem;color:#5a6a70;}
.route-btn .badge{background:var(--marsh-green);color:#fff;border-radius:12px;padding:3px 8px;font-size:.7rem;font-weight:700;}

/* ranking */
.rank-list{list-style:none;padding:0;margin:8px 0;display:grid;gap:8px;}
.rank-item{display:flex;align-items:center;gap:10px;border:1px solid rgba(18,59,74,.16);border-radius:10px;padding:8px 10px;background:#fff;}
.rank-num{font-family:var(--font-interface);font-weight:800;background:var(--lake-navy);color:#fff;border-radius:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.rank-move{display:flex;gap:4px;margin-left:auto;}
.rank-move button{min-width:40px;min-height:40px;border-radius:8px;border:1px solid rgba(18,59,74,.2);background:var(--mist-blue);font-weight:800;}

/* chain */
.chain-list{list-style:none;padding:0;margin:0;display:grid;gap:10px;}
.chain-card{border:2px solid rgba(18,59,74,.16);border-radius:12px;padding:12px 14px;background:#fff;display:flex;gap:12px;align-items:flex-start;}
.chain-card.dragging{opacity:.5;}
.chain-card.over{border-color:var(--field-gold);}
.chain-handle{cursor:grab;font-size:1.2rem;color:#8a979d;user-select:none;padding-top:2px;}
.chain-order{font-family:var(--font-interface);font-weight:800;background:var(--water-teal);color:#fff;border-radius:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.chain-text{flex:1;}
.chain-controls{display:flex;gap:4px;flex-direction:column;}
.chain-controls button{min-width:40px;min-height:36px;border-radius:8px;border:1px solid rgba(18,59,74,.2);background:var(--mist-blue);font-weight:800;}
.confidence-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.conf-btn{border:2px solid rgba(18,59,74,.2);background:#fff;border-radius:16px;padding:6px 10px;font-size:.75rem;font-weight:700;min-height:38px;}
.conf-btn.active{background:var(--marsh-green);color:#fff;border-color:var(--marsh-green);}

/* model runs */
.run-result{border:1px solid rgba(18,59,74,.16);border-radius:12px;padding:14px;background:var(--mist-blue);margin-top:10px;}
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0;}
.metric{background:#fff;border-radius:10px;padding:10px;text-align:center;border:1px solid rgba(18,59,74,.12);}
.metric .val{font-family:var(--font-interface);font-weight:800;font-size:1.35rem;color:var(--lake-navy);}
.metric .lab{font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;color:#5a6a70;}
.algae-High{color:var(--rust-coral);}
.algae-Moderate{color:var(--field-gold);}
.algae-Low{color:var(--marsh-green);}
.delta{font-size:.8rem;font-weight:700;}
.delta.down{color:var(--marsh-green);}
.delta.up{color:var(--rust-coral);}
.run-log{margin-top:10px;display:grid;gap:6px;}
.run-log-item{font-size:.82rem;background:#fff;border:1px solid rgba(18,59,74,.12);border-radius:8px;padding:6px 10px;}

/* idea cards */
.idea-grid{display:grid;gap:10px;}
.idea-card{border:2px solid rgba(18,59,74,.14);border-radius:12px;padding:12px 14px;background:#fff;}
.idea-card h4{margin:0 0 4px;}
.role-select{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.role-select button{border:2px solid rgba(18,59,74,.2);background:#fff;border-radius:14px;padding:6px 10px;font-size:.75rem;font-weight:700;min-height:36px;}
.role-select button.active{background:var(--field-gold);color:var(--charcoal);border-color:var(--field-gold);}

/* generated brief */
.brief-doc{background:#fff;border:1px solid rgba(18,59,74,.16);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-md);}
.brief-banner{background:linear-gradient(120deg,var(--lake-navy),var(--water-teal));color:#fff;padding:20px 22px;}
.brief-banner h2{color:#fff;margin:0 0 4px;font-family:var(--font-title);font-size:1.6rem;}
.brief-banner .sub{font-family:var(--font-interface);opacity:.9;font-size:.9rem;}
.brief-body{padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.brief-section h3{border-bottom:2px solid var(--field-gold);padding-bottom:4px;font-size:1.05rem;}
.brief-section.full{grid-column:1/-1;}
.brief-chain{list-style:none;padding:0;margin:0;counter-reset:bc;}
.brief-chain li{position:relative;padding:6px 6px 6px 34px;margin-bottom:4px;background:var(--mist-blue);border-radius:8px;counter-increment:bc;}
.brief-chain li::before{content:counter(bc);position:absolute;left:6px;top:6px;background:var(--water-teal);color:#fff;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--font-interface);font-weight:800;font-size:.8rem;}
.callout{background:var(--warm-sand);border-left:4px solid var(--field-gold);padding:8px 12px;border-radius:6px;margin:6px 0;}
.blank-note{color:#a06a4b;font-style:italic;}

/* quiz */
.seg{display:inline-flex;border:2px solid var(--water-teal);border-radius:24px;overflow:hidden;}
.seg button{border:none;background:#fff;color:var(--water-teal);padding:11px 18px;font-weight:800;min-height:48px;}
.seg button.active{background:var(--water-teal);color:#fff;}
.quiz-item{border:1px solid rgba(18,59,74,.16);border-radius:12px;padding:16px;margin-bottom:12px;background:#fff;}
.quiz-q{font-family:var(--font-interface);font-weight:800;color:var(--lake-navy);margin-bottom:10px;}
.choice{display:flex;gap:10px;align-items:flex-start;border:2px solid rgba(18,59,74,.16);border-radius:10px;padding:11px 12px;margin-bottom:8px;background:#fff;cursor:pointer;}
.choice:hover{border-color:var(--water-teal);}
.choice input{margin-top:3px;min-width:20px;min-height:20px;}
.choice.correct{border-color:var(--marsh-green);background:#f1f8ea;}
.choice.incorrect{border-color:var(--rust-coral);background:#fbeeea;}
.fb{margin-top:8px;border-radius:8px;padding:10px 12px;font-size:.9rem;}
.fb.ok{background:#f1f8ea;border-left:4px solid var(--marsh-green);}
.fb.no{background:#fbeeea;border-left:4px solid var(--rust-coral);}
.fb.none{background:#f4f2ea;border-left:4px solid var(--field-gold);}
.result-banner{background:var(--lake-navy);color:#fff;border-radius:12px;padding:16px;margin-bottom:14px;}
.result-banner .score{font-family:var(--font-interface);font-weight:800;font-size:1.6rem;}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(18,59,74,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg);}
.modal-head{padding:16px 18px;border-bottom:1px solid rgba(18,59,74,.12);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{margin:0;}
.modal-body{padding:16px 18px;}
.modal-foot{padding:14px 18px;border-top:1px solid rgba(18,59,74,.12);display:flex;justify-content:flex-end;gap:10px;}
.close-x{background:none;border:none;font-size:1.4rem;color:var(--lake-navy);min-width:44px;min-height:44px;}

/* glossary */
.gloss-search{width:100%;margin-bottom:10px;}
.gloss-term{border-bottom:1px solid rgba(18,59,74,.1);padding:8px 0;}
.gloss-term dt{font-family:var(--font-interface);font-weight:800;color:var(--water-teal);}
.gloss-term dd{margin:2px 0 0;}

/* launch */
.launch-hero{position:relative;border-radius:18px;overflow:hidden;margin-bottom:18px;}
.launch-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;}
.save-note{font-size:.82rem;color:#5a6a70;margin-top:10px;display:inline-flex;gap:6px;align-items:center;}

.pill{display:inline-block;background:var(--mist-blue);border:1px solid #cfe6e4;border-radius:14px;padding:3px 10px;font-size:.75rem;font-weight:700;color:var(--lake-navy);font-family:var(--font-interface);margin:2px 4px 2px 0;}

.report-box{background:#fff;border:1px solid rgba(18,59,74,.14);border-radius:12px;padding:14px;}

function deepMerge(base,over){
  if(Array.isArray(base))return Array.isArray(over)?over:base;
  if(base&&typeof base==="object"){
    const out={};for(const k in base)out[k]=deepMerge(base[k],over?over[k]:undefined);
    if(over&&typeof over==="object")for(const k in over)if(!(k in out))out[k]=over[k];
    return out;
  }
  return over===undefined?base:over;
}

const GLOSSARY=[
  ["aquatic ecologist","A scientist who studies how living things interact with water, habitats, and the conditions around them."],
  ["juvenile","A young organism that is not yet fully grown, such as a young fish."],
  ["bluegill","A common freshwater sunfish found in many North American lakes and ponds."],
  ["population","All the organisms of the same kind living in the same area, such as the bluegill in Silver Lake."],
  ["trait","A feature of an organism, such as body length or body mass."],
  ["development","The way an organism grows and its traits form over time."],
  ["body length","How long a fish is, usually measured from head to tail."],
  ["body mass","How much matter a fish contains, measured as its weight in grams."],
  ["body condition","A rating of how healthy and well-fed a fish appears for its size."],
  ["evidence","Information gathered by observing or measuring that helps support or test an idea."],
  ["claim","A statement that answers a question and can be supported with evidence."],
  ["cause and effect","A relationship in which one event or condition leads to another."],
  ["environmental condition","A feature of the surroundings, such as the amount of oxygen in the water."],
  ["dissolved oxygen","Oxygen gas mixed into water that fish and other water organisms need to breathe."],
  ["algae","Simple water plants that can grow quickly when there are extra nutrients."],
  ["decomposition","The breaking down of dead plants and other material, which can use up oxygen."],
  ["nutrient","A substance that living things use to grow; extra nutrients in water can cause fast algae growth."],
  ["runoff","Water that flows over land instead of soaking in, often carrying materials with it."],
  ["stormwater","Rainwater that flows off streets, lawns, and other surfaces after a storm."],
  ["feeder stream","A small stream that carries water into a larger body of water."],
  ["wetland","An area where the land is covered or soaked with water and supports water-loving plants."],
  ["vegetated buffer","A strip of plants between developed land and a waterway that helps slow and filter runoff."],
  ["rain garden","A planted basin that collects runoff and lets it soak into the ground."],
  ["monitoring","Measuring conditions over time to watch for changes."],
  ["mitigation","Actions taken to reduce or prevent a problem."],
  ["model","A tool or simulation used to predict what might happen in a real system."],
  ["uncertainty","The parts of a conclusion that are still not fully known or proven."],

let ttsOn=false;

function screenReadText(){
  const stage=$("#stage");if(!stage)return "";
  const sel=".scene-body,.lead-in,.dialogue,.think,.narrative,.subtle-prompt,.scene-caption,.prompt-box,.msg-line,.st-body,.case-file,.transfer,.record-col,h2,.field-label";
  const picked=[];
  stage.querySelectorAll(sel).forEach(el=>{
    if(el.closest(".hidden"))return;
    if(picked.some(p=>p.contains(el)))return;
    if((el.textContent||"").replace(/\s+/g," ").trim())picked.push(el);
  });
  return picked.map(el=>(el.textContent||"").replace(/\s+/g," ").trim()).join(". ");
}
function toggleTTS(){
  if(!ttsSupported())return;
  if(ttsOn){stopTTS();return;}
  const text=screenReadText();if(!text)return;
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.rate=0.95;u.pitch=1;u.lang="en-US";
    u.onend=()=>{ttsOn=false;updateTTSBtn();};
    u.onerror=()=>{ttsOn=false;updateTTSBtn();};
    window.speechSynthesis.speak(u);ttsOn=true;updateTTSBtn();
  }catch(e){ttsOn=false;updateTTSBtn();}
}

/* ---------------- Shared: line chart ---------------- */
function chartSVG(opts){
  const W=opts.width||660,H=opts.height||320;
  const m={t:18,r:16,b:52,l:52};
  const pw=W-m.l-m.r, ph=H-m.t-m.b;
  const xs=opts.xLabels, n=xs.length;
  const yMin=opts.yMin, yMax=opts.yMax, yr=yMax-yMin||1;
  const X=i=> m.l + (n<=1?pw/2:(i/(n-1))*pw);
  const Y=v=> m.t + ph - ((v-yMin)/yr)*ph;
  let bands="";
  (opts.bands||[]).forEach(b=>{
    const y1=Y(Math.min(b.to,yMax)), y2=Y(Math.max(b.from,yMin));
    bands+=`<rect x="${m.l}" y="${y1}" width="${pw}" height="${Math.max(0,y2-y1)}" fill="${b.fill}" opacity="0.5"></rect>`;
  });
  let grid="",yticks=4;
  for(let i=0;i<=yticks;i++){
    const v=yMin+(yr*i/yticks), y=Y(v);
    grid+=`<line class="grid-line" x1="${m.l}" y1="${y}" x2="${W-m.r}" y2="${y}"></line>`;
    grid+=`<text x="${m.l-8}" y="${y+4}" text-anchor="end" font-size="11">${(+v.toFixed(1))}</text>`;
  }
  let xlab="";
  xs.forEach((lab,i)=>{xlab+=`<text x="${X(i)}" y="${H-m.b+18}" text-anchor="middle" font-size="11">${esc(lab)}</text>`;});
  let lines="";
  opts.series.forEach(s=>{
    const pts=s.values.map((v,i)=>`${X(i)},${Y(v)}`).join(" ");
    lines+=`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="3" stroke-linejoin="round"></polyline>`;
    s.values.forEach((v,i)=>{
      lines+=`<circle cx="${X(i)}" cy="${Y(v)}" r="5" fill="${s.color}"><title>${esc(s.name)} — ${esc(xs[i])}: ${v} ${esc(opts.unit||"")}</title></circle>`;
    });
  });
  const yLabel=opts.yLabel?`<text transform="translate(14,${m.t+ph/2}) rotate(-90)" text-anchor="middle" font-size="12" font-weight="700">${esc(opts.yLabel)}</text>`:"";
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opts.ariaLabel||"Line chart")}" style="max-width:${W}px">
    ${bands}${grid}
    <line class="axis-line" x1="${m.l}" y1="${m.t}" x2="${m.l}" y2="${m.t+ph}"></line>
    <line class="axis-line" x1="${m.l}" y1="${m.t+ph}" x2="${W-m.r}" y2="${m.t+ph}"></line>
    ${yLabel}${xlab}${lines}
  </svg>`;
}
function chartLegend(series){
  return `<div class="oxy-legend">${series.map(s=>`<span><span class="swatch" style="background:${s.color}"></span>${esc(s.name)}</span>`).join("")}</div>`;
}
function chartTable(xLabels,series,unit){
  let head=`<tr><th>${esc(unit||"")}</th>${series.map(s=>`<th>${esc(s.name)}</th>`).join("")}</tr>`;
  let rows=xLabels.map((lab,i)=>`<tr><th>${esc(lab)}</th>${series.map(s=>`<td>${s.values[i]}</td>`).join("")}</tr>`).join("");
  return `<table class="data-table"><caption class="sr-summary" style="text-align:left">Data table for the chart.</caption><thead>${head}</thead><tbody>${rows}</tbody></table>`;
}

function renderEvidence(groupPath,items,max,mode){
  const sel=getPath(groupPath)||[];
  const icon=mode==="star"?"★":"✓";
  return `<div class="evi-list" data-group="${groupPath}" data-max="${max}" role="group" aria-label="Select evidence">
    ${items.map(it=>{

        <button type="button" class="evi-toggle" data-evi="${it.id}" aria-pressed="${on}" aria-label="${on?"Deselect":"Select"} ${esc(it.label)}">${on?icon:""}</button>
        <div class="evi-body"><strong>${esc(it.label)}</strong>${it.desc?`<div class="small muted">${esc(it.desc)}</div>`:""}</div>
      </div>`;
    }).join("")}
    <div class="small muted" data-evi-count>Selected ${sel.length} of up to ${max}.</div>
  </div>`;
}
function initEvidence(root){
  $$("[data-group]",root).forEach(group=>{
    const path=group.dataset.group, max=+group.dataset.max;
    const icon=group.getAttribute("data-mode")==="star"?"★":"✓";
    group.addEventListener("click",e=>{
      const btn=e.target.closest("[data-evi]");if(!btn)return;
      let arr=getPath(path)||[];const id=btn.dataset.evi;
      if(arr.includes(id))arr=arr.filter(x=>x!==id);
      else{if(arr.length>=max){return;}arr=arr.concat([id]);}
      setPath(path,arr);
      const item=btn.closest(".evi-item");const on=arr.includes(id);
      item.classList.toggle("sel",on);btn.setAttribute("aria-pressed",on);
      btn.textContent=on?icon:"";
      const cnt=group.querySelector("[data-evi-count]");if(cnt)cnt.textContent=`Selected ${arr.length} of up to ${max}.`;
    });
  });
}
/* simpler robust re-render for evidence icons */
function evidenceIconRefresh(root){
  $$("[data-group]",root).forEach(group=>{
    const path=group.dataset.group;const sel=getPath(path)||[];
    const star=group.getAttribute("data-mode")==="star";
    $$(".evi-toggle",group).forEach(b=>{const on=sel.includes(b.dataset.evi);b.textContent=on?(star?"★":"✓"):"";});

}

/* ---------- Narrative helpers ---------- */
const REED_IMG="Images/dr-marcus-reed.png";
function _attrLine(line,name,verb){
  line=String(line).trim();
  const last=line.slice(-1);
  if(last===".")line=line.slice(0,-1)+",";
  else if(last==="!"||last==="?"||last===","){/* keep */}
  else line=line+",";
  return `&ldquo;${esc(line)}&rdquo; ${name} ${esc(verb)}.`;
}
function _contQuote(line){
  line=String(line).trim();
  if(!/[.!?…]$/.test(line))line+=".";
  return `&ldquo;${esc(line)}&rdquo;`;
}
function speak(nameHtml,lines,verb){
  const L=Array.isArray(lines)?lines:[lines];
  let html=`<p class="dialogue">`+_attrLine(L[0],nameHtml,verb||"says");
  for(let i=1;i<L.length;i++)html+=" "+_contQuote(L[i]);
  return html+`</p>`;
}
function reed(lines,verb){return speak(`<span class="sp">Dr. Reed</span>`,lines,verb||"says");}
function say(who,initials,lines,verb){return speak(`<span class="sp">${esc(who)}</span>`,lines,verb||"says");}

}

      const series=[

      fd.selectedComparisonByVariable[curVar]=comp;

      const open=t.classList.toggle("hidden")===false;
      btn.setAttribute("aria-expanded",open);btn.textContent=open?"Hide data table":"Show data table";

    else setContinue(false);
  }
});

      if(wt.periodsViewed.length>=3){$("#oxyReveal",root).classList.remove("hidden");setContinue(true);}else setContinue(false);

      const body=`<p class="small muted">Attach any evidence that supports this connection.</p>
        <div class="evi-list">${CHAIN_EVIDENCE.map(e=>`<label class="evi-item"><input type="checkbox" data-e="${e.id}" ${cur.includes(e.id)?"checked":""} style="min-width:22px;min-height:22px"><span class="evi-body">${esc(e.label)}</span></label>`).join("")}</div>`;

          </div>
          <span class="chain-controls"><button data-move="up" data-card="${id}" aria-label="Move up">▲</button><button data-move="down" data-card="${id}" aria-label="Move down">▼</button></span>

      $$("[data-conf]",ul).forEach(b=>b.addEventListener("click",()=>{c2.confidenceRatings[b.dataset.card]=b.dataset.conf;save();renderChain();}));
      $$("[data-attach]",ul).forEach(b=>b.addEventListener("click",()=>attachEvidence(b.dataset.attach)));
      $$("[data-move]",ul).forEach(b=>b.addEventListener("click",()=>move(b.dataset.card,b.dataset.move==="up"?-1:1)));
      $$(".chain-card",ul).forEach(li=>{
        li.addEventListener("dragstart",e=>{dragId=li.dataset.id;li.classList.add("dragging");e.dataTransfer.effectAllowed="move";});
        li.addEventListener("dragend",()=>{li.classList.remove("dragging");$$(".chain-card",ul).forEach(x=>x.classList.remove("over"));});
        li.addEventListener("dragover",e=>{e.preventDefault();li.classList.add("over");});
        li.addEventListener("dragleave",()=>li.classList.remove("over"));
        li.addEventListener("drop",e=>{e.preventDefault();const targetId=li.dataset.id;if(!dragId||dragId===targetId)return;

          c2.chainOrder.splice(to,0,c2.chainOrder.splice(from,1)[0]);save();renderChain();});
      });
    }

  }
});

function deltaHtml(val,base,lowerBetter){
  const d=val-base;if(d===0)return `<span class="delta">same as baseline</span>`;
  const good=lowerBetter?d<0:d>0;
  return `<span class="delta ${good?"down":"up"}">${d<0?"▼":"▲"} ${Math.abs(d)} vs baseline</span>`;
}
function modelResultCard(res,label,vsBaseline){

      <div class="metric"><div class="val algae-${res.algaeResponse}">${res.algaeResponse}</div><div class="lab">Predicted algae response</div></div>
    </div></div>`;
}

  render(){
    const ab=state.actionBrief;
    return `<div class="screen">
      ${sceneHero({stamp:"Town Hall · Communication Workspace",time:"The next evening",title:"Prepare the Town Response",sub:"Dr. Reed opens a communication workspace and transfers the team's evidence into a new case file."})}
      ${dialogue(reed(["The council doesn't need every screen we opened or every number we viewed.","It needs a clear explanation of what changed, the evidence that matters most, and a response that follows from that evidence."]))}
      ${thought("My recommendation should interrupt the cause-and-effect chain — not just describe the problem again.")}

      <div class="card"><h3>State the Finding</h3>
        ${promptBox("What changed in the juvenile bluegill population, and where was the pattern strongest?")}
        ${textField("ab_discovery","Your response","actionBrief.discovery")}</div>

      <div class="card"><h3>Choose the Evidence</h3>
        <label class="field-label">Select two or three pieces of evidence from the whole investigation</label>
        <div class="evi-list" id="strongEvi">
          ${ALL_EVIDENCE.map(e=>{const on=(ab.strongestEvidence||[]).includes(e.id);
            return `<label class="evi-item ${on?"sel":""}"><input type="checkbox" data-strong="${e.id}" ${on?"checked":""} style="min-width:22px;min-height:22px"><span class="evi-body">${esc(e.label)}</span></label>`;}).join("")}
        </div>
        <div id="eviJust"></div>
      </div>

      <div class="card"><h3>Explain the Chain</h3>
        ${promptBox("Explain how nutrient-rich runoff and recurring low dissolved oxygen likely contributed to the fish-development pattern.")}
        ${textField("ab_cause","Your explanation","actionBrief.causeEffectExplanation")}</div>

      <div class="card"><h3>Recommend a North Cove Response</h3>
        <div class="idea-grid">
          ${RESPONSE_IDEAS.map(i=>`<div class="idea-card"><h4>${esc(i.name)}</h4><p class="small muted" style="margin:0">${esc(i.desc)}</p></div>`).join("")}
        </div>
        ${roleSelect("Priority idea","priorityIdea")}
        ${textField("ab_pj","Justification","actionBrief.priorityJustification","What would this idea accomplish, where does it connect to the cause-and-effect chain, and why does it fit the evidence?")}
        ${roleSelect("Supporting idea","supportingIdea")}
        ${textField("ab_sj","Justification","actionBrief.supportingJustification")}
        ${roleSelect("Monitoring idea","monitoringIdea")}
        ${textField("ab_mj","Justification","actionBrief.monitoringJustification")}
      </div>

      <div class="card"><h3>Protect the Proposed Sports Complex</h3>
        ${promptBox("Which features should be included in the sports-complex design?")}
        ${textField("ab_scplan","Your design","actionBrief.sportsComplexPlan")}
        ${promptBox("What model results support your design?")}
        ${textField("ab_scevi","Model evidence","actionBrief.sportsComplexEvidence")}</div>

      <div class="card"><h3>Identify What to Keep Monitoring</h3>
        ${promptBox("What should the town continue investigating or measuring?")}
        ${textField("ab_further","Your response","actionBrief.furtherInvestigation")}</div>
    </div>`;
  },
  init(root){
    const ab=state.actionBrief;
    if(!ab.strongestEvidence)ab.strongestEvidence=[];
    if(!ab.evidenceJustifications)ab.evidenceJustifications={};
    function renderJust(){
      const wrap=$("#eviJust",root);
      wrap.innerHTML=ab.strongestEvidence.map(id=>`<div class="callout"><strong>${esc(EV_MAP[id]||id)}</strong>${promptBox("Why is this evidence important?")}<textarea data-path="actionBrief.evidenceJustifications.${id}"></textarea></div>`).join("");
      autoBindAll(wrap);
    }
    $$("[data-strong]",root).forEach(cb=>cb.addEventListener("change",()=>{
      const id=cb.dataset.strong;let arr=ab.strongestEvidence;
      if(cb.checked){if(arr.length>=3){cb.checked=false;return;}if(!arr.includes(id))arr.push(id);}
      else{ab.strongestEvidence=arr.filter(x=>x!==id);}
      cb.closest(".evi-item").classList.toggle("sel",cb.checked);
      save();renderJust();
    }));
    $$("[data-role]",root).forEach(group=>{
      const path="actionBrief."+group.dataset.role;
      $$("button",group).forEach(b=>b.addEventListener("click",()=>{
        const cur=getPath(path);const val=cur===b.dataset.idea?"":b.dataset.idea;
        setPath(path,val);
        $$("button",group).forEach(x=>x.classList.toggle("active",x.dataset.idea===val));
      }));
    });
    autoBindAll(root);renderJust();setContinue(true);
  }
});
function roleSelect(label,field){
  const cur=getPath("actionBrief."+field)||"";
  return `<label class="field-label">${esc(label)}</label>
    <div class="role-select" data-role="${field}">
      ${RESPONSE_IDEAS.map(i=>`<button data-idea="${i.id}" class="${cur===i.id?"active":""}">${esc(i.name)}</button>`).join("")}
    </div>`;
}
/* ---------------- Deterministic Action Brief builder ---------------- */
function orBlank(v){return (v&&String(v).trim())?esc(v):`<span class="blank-note">No response provided.</span>`;}
function buildBriefHtml(){
  const ab=state.actionBrief, c2=state.secondInvestigation.convergenceTwo, app=state.application;
  const who=state.meta.studentLabel?esc(state.meta.studentLabel):"Investigator";
  const date=fmtDate(ab.generatedAt||nowISO());
  // Evidence
  let evi="";
  if((ab.strongestEvidence||[]).length){
    evi=`<ul style="padding-left:18px;margin:6px 0">`+ab.strongestEvidence.map(id=>{
      const j=(ab.evidenceJustifications||{})[id];
      return `<li style="margin-bottom:6px"><strong>${esc(EV_MAP[id]||id)}</strong>${j&&j.trim()?` — ${esc(j)}`:""}</li>`;
    }).join("")+`</ul>`;
  }else evi=`<p>${orBlank("")}</p>`;
  // Chain
  let chain="";
  if(c2.chainOrder&&c2.chainOrder.length===6){
    chain=`<ol class="brief-chain">`+c2.chainOrder.map(id=>{
      const conf=(c2.confidenceRatings||{})[id];const cl=conf?CONF_OPTS.find(o=>o[0]===conf):null;
      return `<li>${esc(CHAIN_MAP[id])}${cl?` <span class="pill" style="margin-left:4px">${esc(cl[1])}</span>`:""}</li>`;
    }).join("")+`</ol>`;
  }
  // Response ideas
  function ideaBlock(role,justField){
    const id=ab[role];if(!id)return `<p><span class="blank-note">No idea selected.</span></p>`;
    const idea=IDEA_MAP[id];const j=ab[justField];
    return `<div class="callout"><strong>${esc(idea?idea.name:id)}</strong> — ${esc(idea?idea.desc:"")}<br><em>${orBlank(j)}</em></div>`;
  }
  // Combined model
  let model="";
  if(app.finalCombinedRun){
    const r=app.finalCombinedRun;
    model=`<p><strong>Modeled combined design:</strong> ${r.features.map(id=>esc(FEATURE_BY_ID[id]?FEATURE_BY_ID[id].name:id)).join(" + ")}</p>
      <p>Runoff to East Creek: <strong>${r.runoffPercent}%</strong> · Nutrient index: <strong>${r.nutrientIndex}</strong> · Predicted algae response: <strong class="algae-${r.algaeResponse}">${r.algaeResponse}</strong> (baseline was ${baselineModel.runoffPercent}% / ${baselineModel.nutrientIndex} / ${baselineModel.algaeResponse}).</p>`;
  }
  return `<div class="brief-doc" id="briefDoc">
    <div class="brief-banner">
      <h2>Silver Lake Environmental Action Brief</h2>
      <div class="sub">Prepared by the Silver Lake Aquatic Science Investigation Team</div>
      <div class="sub" style="margin-top:6px">Investigator: ${who} · Mentor: Dr. Marcus Reed · ${date}</div>
      <div class="sub">${esc(state.meta.lessonTitle)} · ${esc(state.meta.standard)}</div>
    </div>
    <div class="brief-body">
      <div class="brief-section full"><h3>Fish Population Finding</h3><p>${orBlank(ab.discovery)}</p></div>
      <div class="brief-section"><h3>Evidence</h3>${evi}</div>
      <div class="brief-section"><h3>Recommended Response for North Cove</h3>
        <p class="small muted" style="margin:0 0 4px">Priority</p>${ideaBlock("priorityIdea","priorityJustification")}
        <p class="small muted" style="margin:8px 0 4px">Supporting</p>${ideaBlock("supportingIdea","supportingJustification")}
        <p class="small muted" style="margin:8px 0 4px">Monitoring</p>${ideaBlock("monitoringIdea","monitoringJustification")}
      </div>
      <div class="brief-section full"><h3>How the Environmental Change Affected Fish Development</h3>
        <p>${orBlank(ab.causeEffectExplanation)}</p>${chain}</div>
      <div class="brief-section full"><h3>Sports Complex Prevention Design</h3>
        <p><strong>Proposed features:</strong> ${orBlank(ab.sportsComplexPlan)}</p>
        <p><strong>Model evidence:</strong> ${orBlank(ab.sportsComplexEvidence)}</p>${model}</div>
      <div class="brief-section full"><h3>Monitoring and Further Investigation</h3>
        <p>${orBlank(ab.furtherInvestigation)}</p></div>
    </div>
  </div>`;
}

registerScreen(15,{title:"Communication Desk",hint:"Generate the brief to continue.",
  render(){
    const ab=state.actionBrief;
    const review=[
      ["What We Discovered",ab.discovery],
      ["Strongest Evidence",(ab.strongestEvidence||[]).map(id=>EV_MAP[id]||id).join("; ")],
      ["Cause-and-Effect Explanation",ab.causeEffectExplanation],
      ["Priority idea",ab.priorityIdea?IDEA_MAP[ab.priorityIdea].name:""],
      ["Supporting idea",ab.supportingIdea?IDEA_MAP[ab.supportingIdea].name:""],
      ["Monitoring idea",ab.monitoringIdea?IDEA_MAP[ab.monitoringIdea].name:""],
      ["Sports Complex design",ab.sportsComplexPlan],
      ["Further Investigation",ab.furtherInvestigation]
    ];
    return `<div class="screen">
      ${sceneHero({stamp:"Communication Desk",title:"The Communication Desk",sub:"A professional workspace for turning the investigation into something the town can use."})}
      ${dialogue(reed(["Scientific work isn't finished until the evidence can be communicated clearly.","Review your words carefully. The system can organize your work, but it can't create your reasoning for you."]))}
      <div class="card">
        <h3>Review your inputs</h3>
        <p class="small muted">Use <strong>Back</strong> to return and edit any section. The brief only organizes what you wrote — it does not add or change your reasoning.</p>
        <dl>${review.map(([k,v])=>`<div class="gloss-term"><dt>${esc(k)}</dt><dd>${v&&String(v).trim()?esc(v):"<span class='blank-note'>No response provided.</span>"}</dd></div>`).join("")}</dl>
        <button class="btn btn-gold" id="genBrief">Generate Silver Lake Environmental Action Brief</button>
      </div>
      <div id="briefHost" class="hidden">
        <div id="briefRender" style="margin-bottom:12px"></div>
        ${dialogue(reed(["This is your investigation in a form the town can use.","Check that it still says what you intended."]))}
        <div class="no-print" style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-outline" id="regenBrief">Regenerate Brief</button>
          <button class="btn btn-ghost" id="editBrief">Return to Edit</button>
        </div>
      </div>
    </div>`;
  },
  init(root){
    function generate(){
      state.actionBrief.generatedAt=nowISO();
      const html=buildBriefHtml();
      state.actionBrief.generatedHtml=html;save();
      $("#briefRender",root).innerHTML=html;
      $("#briefHost",root).classList.remove("hidden");
      setContinue(true);
      $("#briefHost",root).scrollIntoView({behavior:(matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth")});
    }
    $("#genBrief",root).addEventListener("click",generate);
    $("#regenBrief",root).addEventListener("click",generate);
    $("#editBrief",root).addEventListener("click",()=>goToScreen(14));
    if(state.actionBrief.generatedHtml){
      $("#briefRender",root).innerHTML=buildBriefHtml();
      $("#briefHost",root).classList.remove("hidden");setContinue(true);
    }else setContinue(false);
  }
});

  {id:"q1",question:"Scientists compared juvenile bluegill of the same age. Fish from North Cove had a lower average length and body mass than fish from other parts of Silver Lake. Which conclusion is best supported by this evidence?",

     {key:"B",text:"Young bluegill in North Cove developed smaller body sizes.",feedback:"Correct. Comparing bluegill of the same species and age showed that the North Cove fish developed shorter bodies and lower mass."},
     {key:"C",text:"All adult fish in Silver Lake are becoming smaller.",feedback:"The evidence focused on juvenile bluegill, not all adult fish in the lake. Look for an answer that stays within the population and age group that scientists measured."},
     {key:"D",text:"Bluegill naturally lose body mass as they grow.",feedback:"The scientists compared fish of the same age. The pattern was connected to location and year, not to older fish naturally losing mass. Focus on what differed between North Cove and the comparison zones."}

  {id:"q2",question:"Which finding best supports the idea that an environmental condition may be affecting the development of North Cove bluegill?",
   correct:"C",
   choices:[
     {key:"A",text:"North Cove is a popular fishing location.",feedback:"This explains why community members may have noticed the fish there first, but it does not show an environmental condition affecting growth. Look for evidence describing the water conditions experienced by the fish."},
     {key:"B",text:"The fishing derby occurs during the summer.",feedback:"The season of the derby does not explain why same-age fish in one part of the lake developed differently. Look for a repeated environmental pattern in North Cove."},
     {key:"C",text:"Dissolved oxygen repeatedly drops to stressful levels in North Cove.",feedback:"Correct. Repeated low dissolved oxygen is an environmental condition that could make growth conditions less favorable for juvenile bluegill."},
     {key:"D",text:"Several different fish species live in Silver Lake.",feedback:"The number of species in the lake does not explain the developmental pattern in the juvenile bluegill. Look for evidence that directly describes a changing condition in North Cove."}
   ],noResponse:"No answer was selected. Look for the choice that identifies a recurring condition in North Cove's water."},
  {id:"q3",question:"Which sequence best explains how nutrient-rich runoff could affect juvenile bluegill?",
   correct:"B",
   choices:[
     {key:"A",text:"More runoff → more adult fish → less rain → smaller young fish",feedback:"This sequence does not match the investigation evidence. Runoff did not cause less rain, and the evidence did not show that more adult fish explained the pattern. Look for the chain connecting nutrients, algae, oxygen, and growth conditions."},
     {key:"B",text:"More nutrients → more algae and decomposition → lower dissolved oxygen → less favorable growth conditions",feedback:"Correct. This sequence connects the environmental change to the recurring water condition and then to less favorable conditions for juvenile fish growth."},
     {key:"C",text:"More algae → more oxygen at all times → faster fish growth",feedback:"Algae may produce oxygen during daylight, but algae and decomposition can also contribute to lower oxygen, especially overnight. The North Cove timeline showed recurring oxygen drops rather than higher oxygen at all times."},
     {key:"D",text:"Lower oxygen → fertilizer moves onto lawns → fish change species",feedback:"This sequence reverses the direction of the evidence. Rain moved nutrients from land toward the lake, and the fish remained bluegill. Look for a chain that begins with nutrient-rich runoff."}
   ],noResponse:"No answer was selected. Review the order of events in the team's cause-and-effect chain."},
  {id:"q4",question:"Which explanation is best supported by the Silver Lake evidence?",
   correct:"C",
   choices:[
     {key:"A",text:"Low dissolved oxygen was definitely the only cause of the smaller fish.",feedback:"The evidence supports low oxygen as a likely contributor, but it does not prove that it was the only possible cause. Look for an explanation that matches the evidence without claiming more certainty than the investigation provides."},
     {key:"B",text:"Nutrient runoff immediately changed the inherited traits of every bluegill.",feedback:"The investigation focused on how environmental conditions affected the development of body-size traits. It did not show an immediate change to inherited information, and it did not include every bluegill."},
     {key:"C",text:"Recurring low oxygen likely contributed to reduced growth in juvenile bluegill.",feedback:"Correct. This explanation connects the repeated environmental condition to the developmental pattern while accurately showing that the evidence supports a likely contribution rather than absolute proof."},
     {key:"D",text:"The evidence proves that every fish in North Cove will remain small.",feedback:"The evidence described a population pattern among sampled juvenile fish. It did not predict the future of every individual fish. Look for an explanation that stays within the limits of the evidence."}
   ],noResponse:"No answer was selected. Choose the explanation that is supported by the evidence but does not overclaim."},
  {id:"q5",question:"Which investigation would provide the strongest evidence that an environmental change is affecting fish development?",
   correct:"C",
   choices:[
     {key:"A",text:"Compare different fish species caught by different anglers.",feedback:"Different species naturally grow to different sizes, and different anglers may use different methods. Look for a comparison that keeps species, age, season, and survey method consistent."},
     {key:"B",text:"Compare adult fish with newly hatched fish.",feedback:"Fish of very different ages naturally differ in size. This comparison would not show whether the same-age fish developed differently under different environmental conditions."},
     {key:"C",text:"Compare the same species and age group from different lake zones using the same survey method.",feedback:"Correct. Keeping species, age group, season, and survey method consistent makes the lake-zone comparison more reliable."},

  {id:"q6",question:"After several years of increased runoff, scientists find that same-age young perch near one stream are shorter and have lower body mass than perch elsewhere in the lake. Oxygen levels near that stream also repeatedly fall below supportive levels. Which explanation is best supported?",

     {key:"A",text:"The perch chose to become smaller.",feedback:"Organisms do not choose how environmental conditions affect their growth. Look for the explanation that connects the recurring water condition to how the young fish developed."},

function quizChoiceText(item,key){const c=item.choices.find(c=>c.key===key);return c?c.text:"";}
function quizChoiceFeedback(item,key){const c=item.choices.find(c=>c.key===key);return c?c.feedback:"";}

registerScreen(16,{title:"Case Complete",hideContinue:true,
  render(){
    return `<div class="screen">
      ${sceneHero({stamp:"Silver Lake",title:"Case Complete",sub:"The water is calm again. The team's work is on its way to the people who asked for it.",img:"Images/silver-lake-hero.png",alt:"A calm view of Silver Lake at the close of the investigation."})}
      ${sysMsg("Delivery confirmed",[`<span class="ok">✓</span> Environmental Action Brief delivered to the Silver Lake Town Council and Parks Department.`])}
      ${dialogue(
        reed("Nice work. Take a second to appreciate what just happened."),
        reed("When folks at the derby first said the young fish looked smaller, we didn't know if it was real, or what might be behind it. A feeling isn't evidence."),
        reed("You followed that feeling all the way to a real explanation — and you stayed honest about what the evidence could and couldn't prove."),
        reed("That's what protecting a place like Silver Lake actually looks like. Thank you — Pinecrest's lucky to have you on the water.")
      )}
      ${thought("It started with fish that just seemed smaller. It ended with an explanation I could actually stand behind — and a few honest questions still worth chasing.")}
      <div class="card panel-journal">
        <h2>Final reflection</h2>
        ${promptBox("How did your thinking about the Silver Lake fish change during the investigation?")}
        ${textField("ref1","Your reflection","reflection.changedThinking")}
        ${promptBox("Which piece of evidence changed your thinking the most? What did it help you understand about how the environment can change an animal's traits?")}
        ${textField("ref2","Your reflection","reflection.influentialEvidence")}
      </div>
      <div class="card">
        <h2>Check your understanding</h2>
        <p>Would you like to check your understanding with a short six-question quiz?</p>
        <div class="seg" role="group" aria-label="Quiz choice">
          <button id="quizYes">Yes, take the quiz</button>
          <button id="quizNo">No, finish my journal</button>
        </div>
        <div id="quizHost" class="hidden" style="margin-top:14px"></div>
        <div id="quizResults" style="margin-top:14px"></div>
      </div>
      <div id="exportHost" class="card hidden">
        <h2>Finish</h2>
        <p class="small muted">Your investigation journal collects everything you did, including any blanks or skipped items, exactly as you left them.</p>
        <button class="btn btn-gold" id="exportBtn">Export Investigation Journal</button>
        <span id="exportNote" class="small muted" style="margin-left:10px"></span>
      </div>
      <div style="text-align:center;margin:8px 0 4px"><span class="location-stamp" style="background:var(--marsh-green);border-color:var(--marsh-green)">Silver Lake Case File: Complete</span></div>
    </div>`;
  },
  init(root){
    autoBindAll(root);
    state.quiz.offered=true;save();
    const host=$("#quizHost",root),results=$("#quizResults",root);
    function showExport(){$("#exportHost",root).classList.remove("hidden");}
    function chooseNo(){
      state.quiz.choice="declined";quizActiveTiming=false;save();
      $("#quizYes",root).classList.remove("active");$("#quizNo",root).classList.add("active");
      host.classList.add("hidden");host.innerHTML="";results.innerHTML="";
      showExport();
    }
    function chooseYes(){
      state.quiz.choice="taken";if(!state.quiz.startedAt)state.quiz.startedAt=nowISO();
      if(!state.quiz.submittedAt)quizActiveTiming=true;save();
      $("#quizNo",root).classList.remove("active");$("#quizYes",root).classList.add("active");
      host.classList.remove("hidden");renderQuiz();
      if(state.quiz.submittedAt)renderResults();
    }
    function renderQuiz(){
      if(state.quiz.submittedAt){host.innerHTML="";return;}
      host.innerHTML=QUIZ.map((item,i)=>`<div class="quiz-item"><div class="quiz-q">${i+1}. ${esc(item.question)}</div>
        ${item.choices.map(c=>`<label class="choice"><input type="radio" name="${item.id}" value="${c.key}" ${state.quiz.answers[item.id]===c.key?"checked":""}><span><strong>${c.key}.</strong> ${esc(c.text)}</span></label>`).join("")}
      </div>`).join("")+`<button class="btn btn-gold" id="submitQuiz">Submit Quiz</button>`;
      $$("input[type=radio]",host).forEach(r=>r.addEventListener("change",()=>{state.quiz.answers[r.name]=r.value;save();}));
      $("#submitQuiz",host).addEventListener("click",gradeQuiz);
    }
    function gradeQuiz(){
      state.quiz.submittedAt=nowISO();quizActiveTiming=false;
      let score=0,answered=0;const itemResults=[];
      QUIZ.forEach(item=>{
        const sel=state.quiz.answers[item.id]||"";
        const isCorrect=sel===item.correct;
        if(sel)answered++;if(isCorrect)score++;
        itemResults.push({id:item.id,selected:sel,correct:isCorrect,answered:!!sel});
      });
      state.quiz.score=score;state.quiz.answeredCount=answered;state.quiz.percentage=Math.round(score/QUIZ.length*100);
      state.quiz.itemResults=itemResults;state.quiz.feedbackDisplayed=true;save();
      host.innerHTML="";renderResults();
    }
    function renderResults(){
      const q=state.quiz;
      let html=`<div class="result-banner"><div class="score">Score: ${q.score} of ${QUIZ.length}</div>
        <div>Questions answered: ${q.answeredCount} of ${QUIZ.length} · ${q.percentage}% · Time: ${fmtDuration(state.timing.quizSeconds)}</div></div>
        <p>Quiz complete. Review your responses and feedback below. Your results will be included in your investigation journal.</p>`;
      QUIZ.forEach((item,i)=>{
        const sel=q.answers[item.id]||"";const isCorrect=sel===item.correct;
        html+=`<div class="quiz-item"><div class="quiz-q">${i+1}. ${esc(item.question)}</div>`;
        item.choices.forEach(c=>{
          let cls="choice";if(c.key===item.correct)cls+=" correct";if(c.key===sel&&!isCorrect)cls+=" incorrect";
          html+=`<div class="${cls}"><span><strong>${c.key}.</strong> ${esc(c.text)}${c.key===sel?" &nbsp;<em>(your answer)</em>":""}${c.key===item.correct?" &nbsp;✓":""}</span></div>`;
        });
        if(!sel)html+=`<div class="fb none">${esc(item.noResponse)}</div>`;
        else html+=`<div class="fb ${isCorrect?"ok":"no"}">${esc(quizChoiceFeedback(item,sel))}</div>`;
        html+=`</div>`;
      });
      results.innerHTML=html;showExport();
    }
    $("#quizYes",root).addEventListener("click",chooseYes);
    $("#quizNo",root).addEventListener("click",chooseNo);
    $("#exportBtn",root).addEventListener("click",()=>{exportJournal();$("#exportNote",root).textContent="Downloaded. You can export again any time.";});
    // restore prior choice
    if(state.quiz.choice==="declined"){chooseNo();}
    else if(state.quiz.choice==="taken"){chooseYes();}
  }
});

const TIMING_LABELS={"1":"Assignment Waiting","2":"Summer in Pinecrest","3":"Meet Dr. Reed","4":"Two Evidence Stations","5A":"Community Case Journal","5B":"Fisheries Data Lab","6":"Briefing Call","7":"Field Station Briefing","8":"Two Questions Remain","9A":"Sensor Logs","9B":"Town Waterway Table","10":"Return to the Briefing","11":"Evidence Chain","12":"Parks Department Request","13":"Modeling Lab","14":"Town Response","15":"Communication Desk","16":"Case Complete"};
function xv(v){return (v&&String(v).trim())?esc(v):`<span class="blank">(no response provided)</span>`;}
function xlist(arr,mapFn){return (arr&&arr.length)?`<ul>${arr.map(mapFn||(x=>`<li>${esc(x)}</li>`)).join("")}</ul>`:`<p class="blank">(none selected)</p>`;}
function exportImg(src){const alt=IMG_ALT[src]||"Lesson image.";return `<div class="imgref"><strong>Image:</strong> ${esc(src)}<br><span class="cap">${esc(alt)}</span></div>`;}
function exportChart(series,xLabels,opts){
  return chartSVG(Object.assign({xLabels,series},opts))+chartTable(xLabels,series,opts.unit||"");
}
function exportJournal(){
  const s=state, ab=s.actionBrief, c2=s.secondInvestigation.convergenceTwo, app=s.application;
  const label=s.meta.studentLabel||"Investigator";
  // Decision Point 1 section

  if(s.navigation.firstPath==="community"){

  }else{

    let graphs="";

      const g=fd.savedGraphStateByVariable[vk];const V=VARIABLES[vk];
      const series=[{name:"North Cove",color:ZONE_COLOR["North Cove"],values:g.northCove},{name:g.comparison,color:ZONE_COLOR[g.comparison]||"#168C8C",values:g.comparisonValues}];
      graphs+=`<h4>${esc(g.label)} — North Cove vs ${esc(g.comparison)}</h4>${exportChart(series,YEARS.map(String),{yMin:V.yMin,yMax:V.yMax,unit:g.unit,yLabel:g.label+" ("+g.unit+")"})}
        <p><strong>Note:</strong> ${xv(fd[V.note])}</p>`;
    });
    dp1=`<p><strong>Path chosen:</strong> Fisheries Data Reviewer</p>
      <p><strong>Measurements viewed:</strong> ${fd.variablesViewed.length?esc(fd.variablesViewed.join(", ")):"<span class='blank'>none</span>"}</p>
      ${graphs||"<p class='blank'>(no graphs saved)</p>"}
      <p><strong>Claim:</strong> ${xv(fd.claim)}</p>`;
  }
  const bp1=s.firstInvestigation.briefingPreparation;
  const co1=s.firstInvestigation.convergenceOne;
  // Decision Point 2 section
  let dp2="";
  if(s.navigation.secondPath==="water"){
    const wt=s.secondInvestigation.waterTimeline;let graphs="";
    (wt.periodsViewed||[]).forEach(pk=>{
      const comp=wt.selectedComparisonZone||"West Shore";
      const series=[{name:"North Cove",color:ZONE_COLOR["North Cove"],values:oxygenData["North Cove"][pk]},{name:comp,color:ZONE_COLOR[comp],values:oxygenData[comp][pk]}];
      graphs+=`<h4>${esc(PERIODS[pk].label)} — North Cove vs ${esc(comp)}</h4>${exportChart(series,TIMES,{yMin:2,yMax:8,unit:"mg/L",yLabel:"Dissolved oxygen (mg/L)",bands:OXY_BANDS})}
        <p><strong>Note:</strong> ${xv(wt[PERIODS[pk].note])}</p>`;
    });
    dp2=`<p><strong>Path chosen:</strong> Water-Conditions Timeline</p>

      <p><strong>Periods viewed:</strong> ${wt.periodsViewed.length?esc(wt.periodsViewed.join(", ")):"<span class='blank'>none</span>"}</p>
      ${graphs||"<p class='blank'>(no periods viewed)</p>"}
      <p><strong>Claim:</strong> ${xv(wt.claim)}</p>`;
  }else{
    const wm=s.secondInvestigation.waterwayMap;
    dp2=`<p><strong>Path chosen:</strong> Town Waterways Map</p>
      <p><strong>Routes opened:</strong> ${wm.routesViewed.length?esc(wm.routesViewed.join(", ")):"<span class='blank'>none</span>"}</p>
      <p><strong>Route ranking (most → least likely):</strong> ${wm.routeRanking.length?esc(wm.routeRanking.map(id=>{const r=waterRoutes.find(x=>x.id===id);return r?r.name:id;}).join(" → ")):"<span class='blank'>not ranked</span>"}</p>
      <p><strong>Route notes:</strong></p>${xlist(Object.keys(wm.routeNotes||{}).filter(k=>wm.routeNotes[k]),k=>{const r=waterRoutes.find(x=>x.id===k);return `<li><strong>${esc(r?r.name:k)}:</strong> ${esc(wm.routeNotes[k])}</li>`;})}

  }
  const bp2=s.secondInvestigation.briefingPreparation;
  // Chain
  const chainHtml=(c2.chainOrder&&c2.chainOrder.length)?`<ol>${c2.chainOrder.map(id=>{
    const conf=(c2.confidenceRatings||{})[id];const cl=conf?CONF_OPTS.find(o=>o[0]===conf):null;

    return `<li>${esc(CHAIN_MAP[id]||id)}${cl?` — <em>${esc(cl[1])}</em>`:""}${att.length?`<br><span class="cap">Evidence: ${att.map(e=>{const ce=CHAIN_EVIDENCE.find(x=>x.id===e);return esc(ce?ce.label:e);}).join(", ")}</span>`:""}</li>`;
  }).join("")}</ol>`:"<p class='blank'>(chain not built)</p>";
  // Model
  let runsHtml=`<p><strong>Baseline:</strong> ${app.baselineRun?`${app.baselineRun.runoffPercent}% runoff · index ${app.baselineRun.nutrientIndex} · algae ${app.baselineRun.algaeResponse}`:"<span class='blank'>not run</span>"}</p>`;
  if(app.individualRuns.length){runsHtml+=`<p><strong>Individual runs:</strong></p><ul>${app.individualRuns.map(r=>{const f=FEATURE_BY_ID[r.id];return `<li>${esc(f?f.name:r.id)} — ${r.runoffPercent}% · index ${r.nutrientIndex} · algae ${r.algaeResponse}${app.runNotes[r.id]?` — note: ${esc(app.runNotes[r.id])}`:""}</li>`;}).join("")}</ul>`;}
  else runsHtml+=`<p class="blank">(no individual runs)</p>`;

  if(app.runNotes&&app.runNotes.combinedRationale)runsHtml+=`<p><strong>Combined recommendation:</strong> ${esc(app.runNotes.combinedRationale)}</p>`;
  // Brief inputs

  let strongEvi=(ab.strongestEvidence||[]).length?`<ul>${ab.strongestEvidence.map(id=>`<li><strong>${esc(EV_MAP[id]||id)}:</strong> ${xv((ab.evidenceJustifications||{})[id])}</li>`).join("")}</ul>`:"<p class='blank'>(none selected)</p>";
  // Quiz
  let quizHtml="";
  const q=s.quiz;
  if(!q.offered||q.choice==="declined"){quizHtml=`<p>Optional Check Your Understanding Quiz: Not attempted by student choice.</p>`;}
  else if(q.choice==="taken"&&!q.submittedAt){quizHtml=`<p>Optional Check Your Understanding Quiz: Started but not submitted.</p>`;}
  else if(q.submittedAt){
    quizHtml=`<p><strong>Score:</strong> ${q.score} of ${QUIZ.length} · <strong>Answered:</strong> ${q.answeredCount} of ${QUIZ.length} · ${q.percentage}%</p>
      <p><strong>Quiz time:</strong> ${fmtDuration(s.timing.quizSeconds)} · Started ${fmtDateTime(q.startedAt)} · Submitted ${fmtDateTime(q.submittedAt)}</p>`;
    QUIZ.forEach((item,i)=>{
      const sel=q.answers[item.id]||"";const correct=sel===item.correct;
      quizHtml+=`<div class="qitem"><p><strong>${i+1}. ${esc(item.question)}</strong></p><ul>${item.choices.map(c=>`<li>${c.key===item.correct?"✓ ":""}${c.key===sel?"➤ ":""}<strong>${c.key}.</strong> ${esc(c.text)}</li>`).join("")}</ul>
        <p><strong>Your answer:</strong> ${sel?esc(sel):"<span class='blank'>none</span>"} · <strong>Correct:</strong> ${esc(item.correct)} · ${sel?(correct?"Correct":"Not correct"):"Not answered"}</p>
        <p class="fbq">${sel?esc(quizChoiceFeedback(item,sel)):esc(item.noResponse)}</p></div>`;
    });
  }
  // Timing
  const st=s.timing.screenSeconds||{};
  const pathTime=(s.navigation.firstPath==="community"?(st["5A"]||0):(st["5B"]||0))+(s.navigation.secondPath==="water"?(st["9A"]||0):(st["9B"]||0));

  let timingRows=Object.keys(TIMING_LABELS).filter(k=>st[k]).map(k=>`<tr><td>${esc(TIMING_LABELS[k])}</td><td>${fmtDuration(st[k])}</td></tr>`).join("");

  const doc=`<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

</style></head><body><div class="wrap">

function boot(){

  const stage=$("#stage");
  continueHandler=null;setContinue(true);
  stage.innerHTML=SCREENS[1].render();
  $("#navbar").style.display="none";

  SCREENS[1].init(stage);
}
// guard: if a branch screen is active without a chosen path, step back
const _origRenderCurrent=renderCurrent;

  if(n===9&&!state.navigation.secondPath){state.navigation.currentScreen=8;}

};
